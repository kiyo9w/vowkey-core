[package]
name = "vowkey-uniffi"
version = "0.1.0"
publish = false

authors.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license = "GPL-3.0-only"
keywords.workspace = true

[lib]
crate-type = ["lib", "staticlib", "cdylib"]
bench = false

[features]
# Dev-only debug-capability tree, exposed to the mobile bindings. Never enable in
# production.
debug-capabilities = [
    "vowkey-pm/debug-capabilities",
    "vowkey-state/debug-capabilities",
]
# WARNING: This feature is for debugging purposes only and should never be enabled in production.
# It disables compile-time debug prevention for cryptographic keys, exposing sensitive key material
# in debug output, and adds tracing debug logs to encrypt/decrypt operations.
dangerous-crypto-debug = ["vowkey-core/dangerous-crypto-debug"]

[dependencies]
async-trait = { workspace = true }
vowkey-auth = { workspace = true, features = ["uniffi"] }
vowkey-collections = { workspace = true, features = ["uniffi"] }
vowkey-core = { workspace = true, features = ["uniffi"] }
vowkey-crypto = { workspace = true, features = ["uniffi"] }
vowkey-crypto-sync-handler = { workspace = true, features = ["uniffi"] }
vowkey-encoding = { workspace = true, features = ["uniffi"] }
vowkey-exporters = { workspace = true, features = ["uniffi"] }
vowkey-fido = { workspace = true, features = ["uniffi"] }
vowkey-generators = { workspace = true, features = ["uniffi"] }
vowkey-importers = { workspace = true, features = ["uniffi"] }
vowkey-managed-settings = { workspace = true, features = ["uniffi"] }
vowkey-managed-settings-types = { workspace = true, features = ["uniffi"] }
vowkey-organizations = { workspace = true, features = ["uniffi"] }
vowkey-pm = { workspace = true, features = ["uniffi"] }
vowkey-policies = { workspace = true, features = ["uniffi"] }
vowkey-random = { workspace = true, features = ["uniffi"] }
vowkey-send = { workspace = true, features = ["uniffi"] }
vowkey-server-communication-config = { workspace = true, features = ["uniffi"] }
vowkey-ssh = { workspace = true, features = ["uniffi"] }
vowkey-state = { workspace = true, features = ["uniffi"] }
vowkey-uniffi-error = { workspace = true }
vowkey-user-crypto-management = { workspace = true, features = ["uniffi"] }
vowkey-vault = { workspace = true, features = ["uniffi"] }
chrono = { workspace = true, features = ["std"] }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uniffi = { workspace = true }
uuid = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
# The use of rustls-platform-verifier requires some extra support to communicate with the Android platform
jni = ">=0.22, <0.23"
libloading = ">=0.8.1, <0.9"
rustls-platform-verifier = { workspace = true }
tracing-android = "0.2.0"

[target.'cfg(target_os = "ios")'.dependencies]
tracing-oslog = "0.3.0"

[build-dependencies]
uniffi = { workspace = true, features = ["build"] }

[lints]
workspace = true
