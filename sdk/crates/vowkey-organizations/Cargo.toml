[package]
name = "vowkey-organizations"
description = """
Internal crate for the vowkey crate. Do not use.
"""

version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
homepage.workspace = true
repository.workspace = true
license = "GPL-3.0-only"
readme.workspace = true
keywords.workspace = true

[features]
uniffi = ["vowkey-core/uniffi", "dep:uniffi"]
wasm = [
    "vowkey-core/wasm",
    "vowkey-ffi/wasm",
    "vowkey-state/wasm",
    "dep:tsify",
    "dep:wasm-bindgen",
]

[dependencies]
vowkey-core = { workspace = true, features = ["internal"] }
vowkey-ffi = { workspace = true }
vowkey-state = { workspace = true }
vowkey-uuid = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_repr = { workspace = true }
tsify = { workspace = true, optional = true }
uniffi = { workspace = true, optional = true }
uuid = { workspace = true }
wasm-bindgen = { workspace = true, optional = true }

[dev-dependencies]
vowkey-test = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt"] }

[lints]
workspace = true
