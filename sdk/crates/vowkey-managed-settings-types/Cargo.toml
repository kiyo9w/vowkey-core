[package]
name = "vowkey-managed-settings-types"
description = """
Shared data types for managed settings, the configuration an organization's IT administrators
enforce through the host operating system's Unified Endpoint Management (UEM) channel.
Internal crate for the vowkey crate. Do not use.
"""

version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license = "GPL-3.0-only"
keywords.workspace = true

[features]
uniffi = ["dep:uniffi"] # Uniffi bindings
wasm = [
    "vowkey-error/wasm",
    "vowkey-ffi/wasm",
    "dep:tsify",
    "dep:wasm-bindgen",
] # WASM support

[dependencies]
vowkey-error = { workspace = true }
vowkey-ffi = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tsify = { workspace = true, optional = true }
uniffi = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }

[lints]
workspace = true
