[package]
name = "vowkey-capture"
description = """
Reads the facts printed on identity documents, starting with the machine-readable zone of passports, cards and visas.
"""

version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license = "GPL-3.0-only"
keywords.workspace = true

[features]
wasm = ["vowkey-error/wasm", "vowkey-ffi/wasm", "dep:tsify", "dep:wasm-bindgen", "rxing/wasm_support"] # WASM support

[dependencies]
vowkey-error = { workspace = true }
vowkey-ffi = { workspace = true }
crc32fast = { workspace = true }
flate2 = { workspace = true }
icu_normalizer = { workspace = true }
image = { workspace = true }
once_cell = { workspace = true }
regex = { workspace = true }
rxing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tsify = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
