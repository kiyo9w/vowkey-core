[package]
name = "vowkey-fido"
description = """
Internal crate for the vowkey crate. Do not use.
"""

version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license = "GPL-3.0-only"
keywords.workspace = true

[features]
uniffi = ["dep:uniffi", "vowkey-core/uniffi", "vowkey-vault/uniffi"]

[dependencies]
async-trait = { workspace = true }
vowkey-api-api = { workspace = true }
vowkey-core = { workspace = true }
vowkey-crypto = { workspace = true }
vowkey-encoding = { workspace = true }
vowkey-vault = { workspace = true }
chrono = { workspace = true }
coset = ">=0.3.7, <0.5"
itertools = ">=0.13.0, <0.16"
p256 = ">=0.13.2, <0.14"
passkey = { git = "https://github.com/bitwarden/passkey-rs", rev = "043279e92e2eb5f509bf87eb7fa50987fd377e32" }
passkey-client = { git = "https://github.com/bitwarden/passkey-rs", rev = "043279e92e2eb5f509bf87eb7fa50987fd377e32", features = [
    "android-asset-validation",
] }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uniffi = { workspace = true, optional = true }
uuid = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }

[lints]
workspace = true
