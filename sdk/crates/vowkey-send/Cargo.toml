[package]
name = "vowkey-send"
description = """
Internal crate for the vowkey crate. Do not use.
"""

version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license = "GPL-3.0-only"
keywords.workspace = true

[features]
uniffi = [
    "vowkey-auth/uniffi",
    "vowkey-core/uniffi",
    "vowkey-crypto/uniffi",
    "vowkey-vault/uniffi",
    "dep:uniffi",
]
wasm = [
    "vowkey-auth/wasm",
    "vowkey-core/wasm",
    "vowkey-encoding/wasm",
    "vowkey-ffi/wasm",
    "vowkey-state/wasm",
    "dep:tsify",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
]

[dependencies]
async-trait = { workspace = true }
vowkey-api-api = { workspace = true }
vowkey-api-base = { workspace = true }
vowkey-auth = { workspace = true }
vowkey-core = { workspace = true, features = ["internal"] }
vowkey-crypto = { workspace = true }
vowkey-encoding = { workspace = true }
vowkey-error = { workspace = true }
vowkey-ffi = { workspace = true }
vowkey-state = { workspace = true }
vowkey-sync = { workspace = true }
vowkey-uuid = { workspace = true }
vowkey-vault = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_bytes = { workspace = true }
serde_json = { workspace = true }
serde_repr = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tsify = { workspace = true, optional = true }
uniffi = { workspace = true, optional = true }
uuid = { workspace = true }
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
zeroize = { workspace = true }

[dev-dependencies]
vowkey-api-api = { workspace = true, features = ["mockall"] }
vowkey-test = { workspace = true }
tokio = { workspace = true, features = ["rt"] }
wiremock = { workspace = true }

[lints]
workspace = true
