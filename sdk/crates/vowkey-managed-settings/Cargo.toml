[package]
name = "vowkey-managed-settings"
description = """
Read access to managed settings, the configuration an organization's IT administrators enforce
through the host operating system's Unified Endpoint Management (UEM) channel.
Internal crate for the vowkey crate. Do not use.
"""

version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license = "GPL-3.0-only"
keywords.workspace = true

[features]
uniffi = [
    "vowkey-core/uniffi",
    "vowkey-managed-settings-types/uniffi",
] # Uniffi bindings
wasm = [
    "vowkey-core/wasm",
    "vowkey-ffi/wasm",
    "vowkey-managed-settings-types/wasm",
    "dep:wasm-bindgen",
] # WASM support

[dependencies]
vowkey-core = { workspace = true }
vowkey-ffi = { workspace = true }
vowkey-managed-settings-types = { workspace = true }
tracing = { workspace = true }
wasm-bindgen = { workspace = true, optional = true }

[lints]
workspace = true
