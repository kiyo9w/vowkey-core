[package]
name = "vowkey-collections"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
homepage.workspace = true
repository.workspace = true
license = "GPL-3.0-only"
readme.workspace = true
keywords.workspace = true

[features]
uniffi = [
    "vowkey-core/uniffi",
    "vowkey-crypto/uniffi",
    "dep:uniffi",
] # Uniffi bindings
wasm = [
    "vowkey-core/wasm",
    "vowkey-ffi/wasm",
    "dep:tsify",
    "dep:wasm-bindgen",
] # WASM support

[dependencies]
vowkey-api-api = { workspace = true }
vowkey-core = { workspace = true, features = ["internal"] }
vowkey-crypto = { workspace = true }
vowkey-error = { workspace = true }
vowkey-ffi = { workspace = true }
vowkey-uuid = { workspace = true }
serde = { workspace = true }
serde_repr = { workspace = true }
thiserror = { workspace = true }
tsify = { workspace = true, optional = true }
uniffi = { workspace = true, optional = true }
uuid = { workspace = true }
wasm-bindgen = { workspace = true, optional = true }

[dev-dependencies]
vowkey-core = { workspace = true, features = ["internal", "test-fixtures"] }
tokio = { workspace = true, features = ["rt"] }

[lints]
workspace = true
