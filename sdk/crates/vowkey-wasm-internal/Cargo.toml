[package]
name = "vowkey-wasm-internal"
version = "0.1.0"
publish = false

authors.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license = "GPL-3.0-only"
keywords.workspace = true

# Neither is imported directly: vowkey-organization-crypto is here to enable wasm-bindgen,
# tsify-macros to hold the workspace version bound. See [dependencies] below.
[package.metadata.cargo-udeps.ignore]
normal = ["vowkey-organization-crypto", "tsify-macros"]

[lib]
crate-type = ["cdylib"]

[features]
default = ["wasm"]
# Always on. The `vowkey-ffi` macros gate what they generate on the enclosing crate's `wasm`
# feature; this crate has no non-wasm build, so the feature exists only to satisfy that.
wasm = []
# Dev-only hand-rolled debug capabilities, exposed to JS as a typed debug tree
# (generic browse over the SDK's state registry). Never enable in production.
debug-capabilities = ["vowkey-pm/debug-capabilities"]
# WARNING: This feature is for debugging purposes only and should never be enabled in production.
# It disables compile-time debug prevention for cryptographic keys, exposing sensitive key material
# in debug output, and adds tracing debug logs to encrypt/decrypt operations.
dangerous-crypto-debug = ["vowkey-core/dangerous-crypto-debug"]
# WARNING: There are a lot of traces emitted to give context for operations. This is quite slow and may slow down decryption
# and other bulk data operations, and should only be enabled for debugging purposes.
performance-tracing = []

[dependencies]
async-trait = { workspace = true }
vowkey-autotype = { workspace = true, features = ["wasm"] }
vowkey-core = { workspace = true, features = ["wasm", "internal"] }
vowkey-crypto = { workspace = true, features = ["wasm"] }
vowkey-crypto-sync-handler = { workspace = true, features = ["wasm"] }
vowkey-emergency-access = { workspace = true, features = ["wasm"] }
vowkey-error = { workspace = true }
vowkey-ffi = { workspace = true, features = ["wasm"] }
vowkey-ipc = { workspace = true, features = ["wasm"] }
vowkey-logging = { workspace = true, features = ["wasm"] }
vowkey-managed-settings = { workspace = true, features = ["wasm"] }
vowkey-member-administration = { workspace = true, features = ["wasm"] }
# This dependency is not used directly, but we need to include it in order to
# ensure wasm-bindgen is generated for the `vowkey-organization-crypto` crate
# See [package.metadata.cargo-udeps.ignore] above for more.
vowkey-organization-crypto = { workspace = true, features = ["wasm"] }
vowkey-organization-invite-link = { workspace = true, features = ["wasm"] }
vowkey-organizations = { workspace = true, features = ["wasm"] }
vowkey-pm = { workspace = true, features = ["wasm"] }
vowkey-policies = { workspace = true, features = ["wasm"] }
vowkey-random = { workspace = true, features = ["wasm"] }
vowkey-send = { workspace = true, features = ["wasm"] }
vowkey-server-communication-config = { workspace = true, features = ["wasm"] }
vowkey-shared-unlock = { workspace = true, features = ["wasm"] }
vowkey-ssh = { workspace = true, features = ["wasm"] }
vowkey-state = { workspace = true, features = ["wasm"] }
vowkey-threading = { workspace = true }
vowkey-user-crypto-management = { workspace = true, features = ["wasm"] }
vowkey-vault = { workspace = true, features = ["wasm"] }
console_error_panic_hook = "0.1.7"
rand = { workspace = true }
rsa = { workspace = true }
serde = { workspace = true }
sha1 = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-web = { version = "0.1.3" }
tsify = { workspace = true }
# Not used directly. `tsify` only requires `tsify-macros ^0.5.5`, so the workspace pin
# on it is only enforced if a member depends on it directly.
tsify-macros = { workspace = true }
uuid = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }

[lints]
workspace = true
