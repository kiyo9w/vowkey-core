[package]
name = "vowkey-pm"
description = """
Internal crate for the vowkey crate. Do not use.
"""

version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license = "GPL-3.0-only"
keywords.workspace = true

[features]
cli = ["vowkey-unlock/cli"]
# Dev-only debug-capability tree rooted on the top-level client.
debug-capabilities = [
    "vowkey-core/debug-capabilities",
    "vowkey-state/debug-capabilities",
]
no-memory-hardening = ["vowkey-core/no-memory-hardening"]
uniffi = [
    "vowkey-collections/uniffi",
    "vowkey-core/uniffi",
    "vowkey-crypto-cipher-suite/uniffi",
    "vowkey-crypto-sync-handler/uniffi",
    "vowkey-exporters/uniffi",
    "vowkey-fido/uniffi",
    "vowkey-generators/uniffi",
    "vowkey-importers/uniffi",
    "vowkey-send/uniffi",
    "vowkey-state/uniffi",
    "vowkey-unlock/uniffi",
    "vowkey-vault/uniffi",
    "dep:uniffi",
]
wasm = [
    "vowkey-auth/wasm",
    "vowkey-collections/wasm",
    "vowkey-core/wasm",
    "vowkey-crypto-cipher-suite/wasm",
    "vowkey-crypto-sync-handler/wasm",
    "vowkey-emergency-access/wasm",
    "vowkey-exporters/wasm",
    "vowkey-ffi/wasm",
    "vowkey-generators/wasm",
    "vowkey-importers/wasm",
    "vowkey-member-administration/wasm",
    "vowkey-organization-invite-link/wasm",
    "vowkey-organizations/wasm",
    "vowkey-policies/wasm",
    "vowkey-send/wasm",
    "vowkey-state/wasm",
    "vowkey-unlock/wasm",
    "vowkey-vault/wasm",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:tsify",
]

[dependencies]
async-trait = { workspace = true }
vowkey-auth = { workspace = true }
vowkey-collections = { workspace = true }
vowkey-core = { workspace = true, features = ["internal"] }
vowkey-crypto = { workspace = true }
vowkey-crypto-cipher-suite = { workspace = true }
vowkey-crypto-sync-handler = { workspace = true }
vowkey-emergency-access = { workspace = true }
vowkey-exporters = { workspace = true }
vowkey-ffi = { workspace = true }
vowkey-fido = { workspace = true }
vowkey-generators = { workspace = true }
vowkey-importers = { workspace = true }
vowkey-member-administration = { workspace = true }
vowkey-organization-invite-link = { workspace = true }
vowkey-organizations = { workspace = true }
vowkey-policies = { workspace = true }
vowkey-send = { workspace = true }
vowkey-server-communication-config = { workspace = true }
vowkey-state = { workspace = true }
vowkey-sync = { workspace = true }
vowkey-unlock = { workspace = true }
vowkey-user-crypto-management = { workspace = true }
vowkey-vault = { workspace = true }

reqwest-middleware = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tsify = { workspace = true, optional = true }
uniffi = { workspace = true, optional = true, features = ["tokio"] }
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }

[lints]
workspace = true
