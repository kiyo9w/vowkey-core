[package]
name = "vowkey-exporters"
description = """
Internal crate for the vowkey crate. Do not use.
"""
exclude = ["/resources"]

version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license = "GPL-3.0-only"
keywords.workspace = true

[features]
uniffi = ["dep:uniffi", "vowkey-core/uniffi"]
wasm = [
    "vowkey-collections/wasm",
    "vowkey-ffi/wasm",
    "vowkey-vault/wasm",
    "dep:tsify",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
]

[dependencies]
vowkey-collections = { workspace = true }
vowkey-core = { workspace = true }
vowkey-crypto = { workspace = true }
vowkey-encoding = { workspace = true }
vowkey-error = { workspace = true }
vowkey-ffi = { workspace = true }
vowkey-fido = { workspace = true }
vowkey-ssh = { workspace = true }
vowkey-vault = { workspace = true }
chrono = { workspace = true, features = ["std"] }
credential-exchange-format = { version = ">=0.4, <0.5" }
csv = "1.3.0"
num-traits = ">=0.2, <0.3"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tsify = { workspace = true, optional = true }
uniffi = { workspace = true, optional = true }
url = { workspace = true }
uuid = { workspace = true }
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
zeroize = { workspace = true }

[dev-dependencies]
vowkey-core = { workspace = true, features = ["internal", "test-fixtures"] }
tokio = { workspace = true, features = ["rt"] }

[lints]
workspace = true
