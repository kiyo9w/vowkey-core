[package]
name = "vowkey-crypto-cipher-suite"
description = """
Internal crate for the vowkey crate. Do not use.
"""

version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license = "GPL-3.0-only"
keywords.workspace = true

[features]
default = []
uniffi = ["vowkey-core/uniffi", "vowkey-crypto/uniffi", "dep:uniffi"]
wasm = [
    "vowkey-core/wasm",
    "vowkey-crypto/wasm",
    "vowkey-ffi/wasm",
    "dep:tsify",
    "dep:wasm-bindgen",
]

[dependencies]
vowkey-core = { workspace = true }
vowkey-crypto = { workspace = true }
vowkey-ffi = { workspace = true }
tsify = { workspace = true, optional = true }
uniffi = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }

[lints]
workspace = true
