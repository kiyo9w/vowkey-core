[package]
name = "vowkey-policies"
description = """
Internal crate for the vowkey crate. Do not use.
"""
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
homepage.workspace = true
repository.workspace = true
license = "GPL-3.0-only"
readme.workspace = true
keywords.workspace = true

[features]
uniffi = [
    "vowkey-core/uniffi",
    "vowkey-organizations/uniffi",
    "dep:uniffi",
] # Uniffi bindings
wasm = [
    "vowkey-core/wasm",
    "vowkey-ffi/wasm",
    "vowkey-organizations/wasm",
    "vowkey-state/wasm",
    "dep:tsify",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
] # WASM support

[dependencies]
async-trait = { workspace = true }
vowkey-api-api = { workspace = true }
vowkey-core = { workspace = true }
vowkey-ffi = { workspace = true }
vowkey-organizations = { workspace = true }
vowkey-state = { workspace = true }
vowkey-sync = { workspace = true }
vowkey-uuid = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_repr = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tsify = { workspace = true, optional = true }
uniffi = { workspace = true, optional = true }
uuid = { workspace = true }
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }

[dev-dependencies]
vowkey-test = { workspace = true }
tokio = { workspace = true, features = ["rt"] }

[lints]
workspace = true
