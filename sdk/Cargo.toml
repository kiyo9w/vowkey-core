[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["support/lints"]

# Global settings for all crates should be defined here
[workspace.package]
# Update using `cargo set-version -p vowkey-core <new-version>`
version = "4.0.0"
authors = ["Vowkey"]
edition = "2024"
# Important: Changing rust-version should be considered a breaking change
rust-version = "1.88.0"
homepage = "https://vowkey.com"
repository = "https://github.com/vowkey/vowkey-core"
license-file = "LICENSE"
readme = "README.md"
keywords = ["vowkey"]

# Define dependencies that are expected to be consistent across all crates
[workspace.dependencies]

# External crates that are expected to maintain a consistent version across all crates
aes = { version = "0.9.0", features = ["zeroize"] }
aes-gcm = { version = "0.11.0", features = ["zeroize"] }
anyhow = ">=1.0, <2.0"
async-trait = ">=0.1.80, <0.2"
vowkey-api-api = { path = "crates/vowkey-api-api", version = "=4.0.0" }
vowkey-api-base = { path = "crates/vowkey-api-base", version = "=4.0.0" }
vowkey-api-identity = { path = "crates/vowkey-api-identity", version = "=4.0.0" }
vowkey-api-key-connector = { path = "crates/vowkey-api-key-connector", version = "=4.0.0" }
vowkey-auth = { path = "crates/vowkey-auth", version = "=4.0.0" }
vowkey-autotype = { path = "crates/vowkey-autotype", version = "=4.0.0" }
vowkey-capture = { path = "crates/vowkey-capture", version = "=4.0.0" }
vowkey-cli = { path = "crates/vowkey-cli", version = "=4.0.0" }
vowkey-collections = { path = "crates/vowkey-collections", version = "=4.0.0" }
vowkey-core = { path = "crates/vowkey-core", version = "=4.0.0" }
vowkey-core-macro = { path = "crates/vowkey-core-macro", version = "=4.0.0" }
vowkey-crypto = { path = "crates/vowkey-crypto", version = "=4.0.0" }
vowkey-crypto-cipher-suite = { path = "crates/vowkey-crypto-cipher-suite", version = "=4.0.0" }
vowkey-crypto-sync-handler = { path = "crates/vowkey-crypto-sync-handler", version = "=4.0.0" }
vowkey-emergency-access = { path = "crates/vowkey-emergency-access", version = "=4.0.0" }
vowkey-encoding = { path = "crates/vowkey-encoding", version = "=4.0.0" }
vowkey-error = { path = "crates/vowkey-error", version = "=4.0.0" }
vowkey-error-macro = { path = "crates/vowkey-error-macro", version = "=4.0.0" }
vowkey-exporters = { path = "crates/vowkey-exporters", version = "=4.0.0" }
vowkey-ffi = { path = "crates/vowkey-ffi", version = "=4.0.0" }
vowkey-ffi-macro = { path = "crates/vowkey-ffi-macro", version = "=4.0.0" }
vowkey-fido = { path = "crates/vowkey-fido", version = "=4.0.0" }
vowkey-generators = { path = "crates/vowkey-generators", version = "=4.0.0" }
vowkey-importers = { path = "crates/vowkey-importers", version = "=4.0.0" }
vowkey-ipc = { path = "crates/vowkey-ipc", version = "=4.0.0" }
vowkey-logging = { path = "crates/vowkey-logging", version = "=4.0.0" }
vowkey-logging-macro = { path = "crates/vowkey-logging-macro", version = "=4.0.0" }
vowkey-member-administration = { path = "crates/vowkey-member-administration", version = "=4.0.0" }
vowkey-organization-crypto = { path = "crates/vowkey-organization-crypto", version = "=4.0.0" }
vowkey-organization-invite-link = { path = "crates/vowkey-organization-invite-link", version = "=4.0.0" }
vowkey-organizations = { path = "crates/vowkey-organizations", version = "=4.0.0" }
vowkey-pm = { path = "crates/vowkey-pm", version = "=4.0.0" }
vowkey-policies = { path = "crates/vowkey-policies", version = "=4.0.0" }
vowkey-random = { path = "crates/vowkey-random", version = "=4.0.0" }
vowkey-send = { path = "crates/vowkey-send", version = "=4.0.0" }
vowkey-sensitive-value = { path = "crates/vowkey-sensitive-value", version = "=4.0.0" }
vowkey-server-communication-config = { path = "crates/vowkey-server-communication-config", version = "=4.0.0" }
vowkey-shared-unlock = { path = "crates/vowkey-shared-unlock", version = "=4.0.0" }
vowkey-ssh = { path = "crates/vowkey-ssh", version = "=4.0.0" }
vowkey-state = { path = "crates/vowkey-state", version = "=4.0.0" }
vowkey-state-bridge-macro = { path = "crates/vowkey-state-bridge-macro", version = "=4.0.0" }
vowkey-sync = { path = "crates/vowkey-sync", version = "=4.0.0" }
vowkey-test = { path = "crates/vowkey-test", version = "=4.0.0" }
vowkey-test-macro = { path = "crates/vowkey-test-macro", version = "=4.0.0" }
vowkey-threading = { path = "crates/vowkey-threading", version = "=4.0.0" }
vowkey-uniffi-error = { path = "crates/vowkey-uniffi-error", version = "=4.0.0" }
vowkey-unlock = { path = "crates/vowkey-unlock", version = "=4.0.0" }
vowkey-user-crypto-management = { path = "crates/vowkey-user-crypto-management", version = "=4.0.0" }
vowkey-uuid = { path = "crates/vowkey-uuid", version = "=4.0.0" }
vowkey-uuid-macro = { path = "crates/vowkey-uuid-macro", version = "=4.0.0" }
vowkey-vault = { path = "crates/vowkey-vault", version = "=4.0.0" }
cbc = { version = "0.2.0", features = ["alloc", "zeroize"] }
chrono = { version = ">=0.4.34, <0.5", features = [
    "clock",
    "serde",
    "std",
], default-features = false }
ciborium = ">=0.2.2, <0.3"
clap = { version = ">=4.5.4, <5", features = ["derive"] }
crypto-bigint = { version = "0.7.5", features = ["alloc"], default-features = false }
curve25519-dalek = { version = "5.0.0", features = ["zeroize"], default-features = false }
data-encoding = ">=2.0, <3"
ed25519-dalek = { version = "3.0.0-pre.7" }
futures = ">=0.3.31, <0.4"
hkdf = "0.13.0"
hmac = "0.13.0"
http = ">=1.4.0, <2.0"
icu_normalizer = { version = "2.2.0", features = [
    "compiled_data",
    "utf8_iter",
], default-features = false }
image = { version = "=0.25.8", default-features = false, features = [
    "jpeg",
    "png",
] }
js-sys = { version = ">=0.3.72, <0.4" }
keepass = { version = ">=0.13.7, <0.16", default-features = false }
mockall = { version = ">=0.13.1, <0.16" }
once_cell = "1.21"
password-rules-parser = ">=1.1.0, <2"
pbkdf2 = { version = "0.13.0-rc.10", default-features = false }
proc-macro2 = ">=1.0.89, <2"
prost = "0.14.4"
quote = ">=1.0.37, <2"
rand = ">=0.10.0, <0.11"
rand_chacha = ">=0.10.0, <0.11"
regex = "1.13"
reqwest = { version = "0.13.3", features = [
    "json",
    "multipart",
    "http2",
    "form",
    "query",
], default-features = false }
reqwest-middleware = { version = "0.5.1", features = [
    "json",
    "multipart",
    "form",
    "query",
] }
rsa = "0.10.0-rc.17"
rustls = { version = "0.23.27", default-features = false, features = [
    "std",
    "tls12",
    "logging",
    "ring",
] }
rustls-platform-verifier = "0.7.0"
rxing = { version = "0.9.3", default-features = false, features = [
    "aztec",
    "datamatrix",
    "decoders",
    "encoding_rs",
    "maxicode",
    "multi_barcode_readers",
    "oned",
    "pdf417",
    "qrcode",
    "serde",
] }
schemars = { version = ">=1.0.0, <2.0", features = ["uuid1", "chrono04"] }
serde = { version = ">=1.0, <2.0", features = ["derive"] }
serde-wasm-bindgen = ">=0.6.0, <0.7"
serde_bytes = { version = ">=0.11.17, <0.12.0" }
serde_json = ">=1.0.96, <2.0"
serde_qs = ">=0.12.0, <0.16"
serde_repr = ">=0.1.12, <0.2"
sha1 = "0.11.0"
sha2 = "0.11.0"
subtle = ">=2.5.0, <3.0"
syn = ">=2.0.87, <3"
thiserror = ">=1.0.40, <3"
tokio = { version = "1.36.0", features = ["macros"] }
tracing = { version = "0.1.41" }
tracing-subscriber = { version = "0.3.20", features = [
    "fmt",
    "env-filter",
    "tracing-log",
] }
# Tsify is pinned as newer versions deprecate from/into_wasm_abi
# We use this extensively and the migration is going to be complex,
# but in the meantime we want to avoid CI failures here.
# https://github.com/madonoharu/tsify/blob/main/CHANGELOG.md#v057
tsify = { version = ">=0.5.5, <0.5.7", features = [
    "js",
], default-features = false }
# The deprecation is emitted by the proc macro, and `tsify` only requires
# `tsify-macros ^0.5.5`, so the bound above has to be repeated here to hold.
tsify-macros = ">=0.5.5, <0.5.7"
uniffi = "=0.32.0"
url = ">=2.5.8, <3.0"
uuid = { version = ">=1.3.3, <2.0", features = ["serde", "v4", "js"] }
validator = { version = ">=0.18.1, <0.22", features = ["derive"] }
wasm-bindgen = { version = "=0.2.114", features = ["serde-serialize"] }
wasm-bindgen-cli = "=0.2.114"
wasm-bindgen-futures = "0.4.64"
wasm-bindgen-test = "0.3.64"
wiremock = ">=0.6.0, <0.7"
zeroize = { version = ">=1.7.0, <2.0" }
zxcvbn = ">=3.0.1, <4.0"

[workspace.lints.clippy]
disallowed-macros = "deny"
unused_async = "warn"
unwrap_used = "deny"
string_slice = "warn"
print_stdout = "warn"
print_stderr = "warn"
# Some errors are logged where they occur, so there is no need to return them.
result_unit_err = "allow"
# `chunks_exact(N)` reads better than the suggested `as_chunks::<N>().0`.
chunks_exact_to_as_chunks = "allow"

[workspace.lints.rust]
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(feature, values("uniffi", "wasm"))',
    'cfg(dylint_lib, values("vowkey_lints"))',
] }

[workspace.metadata.dylint]
libraries = [{ path = "support/lints" }]

# Pinned binary cargo tools used by CI and `scripts/lint.sh`.
# Install the runner once with `cargo install cargo-run-bin --locked`, then
# invoke any tool via `cargo bin <tool> <args>`. See README for details.
[workspace.metadata.bin]
cargo-sort = { version = "2.0.2", locked = true }
cargo-udeps = { version = "0.1.57", locked = true }
cargo-hack = { version = "0.6.33", locked = true }
cargo-llvm-cov = { version = "0.5.38", locked = true }
cargo-release = { version = "0.25.20", locked = true }
cargo-edit = { version = "0.13.6", locked = true, bins = ["cargo-set-version"] }
cargo-dylint = { version = "6.0.0", locked = true }
dylint-link = { version = "6.0.0", locked = true }
cross = { version = "0.2.5", git = "https://github.com/cross-rs/cross.git", rev = "185398b1b885820515a212de720a306b08e2c8c9", locked = true }
clippy-sarif = { version = "0.4.2", git = "https://github.com/psastras/sarif-rs.git", rev = "11c33a53f6ffeaed736856b86fb6b7b09fabdfd8", locked = true }
sarif-fmt = { version = "0.4.2", git = "https://github.com/psastras/sarif-rs.git", rev = "11c33a53f6ffeaed736856b86fb6b7b09fabdfd8", locked = true }

# Turn on a small amount of optimisation in development mode. This might interfere when trying to use a debugger
# if the compiler decides to optimize some code away, if that's the case, it can be set to 0 or commented out
[profile.dev]
opt-level = 1

# Compile all dependencies with some optimizations when building this crate on debug
# This slows down clean builds by about 50%, but the resulting binaries can be orders of magnitude faster
# As clean builds won't occur very often, this won't slow down the development process
[profile.dev.package."*"]
opt-level = 2

# Turn on LTO on release mode
[profile.release]
codegen-units = 1
lto = true
opt-level = "z"

# Enable optimization for the vowkey-crypto crate. This will increase the binary size slightly (~0.1MB),
# but it will more aggressively inline functions. This will help us avoid extra stack copies of keys and
# other sensitive values being left behind without cleanup.
[profile.release.package.vowkey-crypto]
opt-level = 3

# Heavy crypto operations are optimized for speed instead of size. Each crate costs a few KB but
# shortens unlock, vault decryption and ML-DSA operations. RSA crates are left out: building them
# for speed added ~70 KB with no measurable gain (their generic code is instantiated in callers).

# Bulk vault decryption: AES-CBC, EncString base64, reading ciphers from JS
[profile.release.package.aes]
opt-level = 3

[profile.release.package.cbc]
opt-level = 3

[profile.release.package.data-encoding]
opt-level = 3

[profile.release.package.serde-wasm-bindgen]
opt-level = 3

# V2 (COSE) vault decryption: CBOR parsing and XAES-256-GCM
[profile.release.package.ciborium]
opt-level = 3

[profile.release.package.ciborium-ll]
opt-level = 3

[profile.release.package.coset]
opt-level = 3

[profile.release.package.aes-gcm]
opt-level = 3

[profile.release.package.xaes-256-gcm]
opt-level = 3

[profile.release.package.polyval]
opt-level = 3

# KDFs: PBKDF2 (sha2, hmac) and Argon2id (argon2, blake2)
[profile.release.package.argon2]
opt-level = 3

[profile.release.package.blake2]
opt-level = 3

[profile.release.package.hmac]
opt-level = 3

[profile.release.package.sha2]
opt-level = 3

# ML-DSA: signing, verification and key generation
[profile.release.package.keccak]
opt-level = 3

[profile.release.package.ml-dsa]
opt-level = 3

[profile.release.package.module-lattice]
opt-level = 3

[profile.release.package.shake]
opt-level = 3

# Stripping the binary reduces the size by ~30%, but the stacktraces won't be usable anymore.
# This is fine as long as we don't have any unhandled panics, but let's keep it disabled for now
# strip = true
