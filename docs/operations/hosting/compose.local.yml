services:
  server:
    environment:
      DOMAIN: http://${VOWKEY_DOMAIN:?set VOWKEY_DOMAIN}:${VOWKEY_LOCAL_PORT:-8102}
      PUSH_RELAY_URI: http://push:8790
      PUSH_IDENTITY_URI: http://push:8790
  relay:
    environment:
      RELAY_TOKEN_ISSUER: http://${VOWKEY_DOMAIN}:${VOWKEY_LOCAL_PORT:-8102}|login
      RELAY_ALLOW_HTTP: "true"
      RELAY_ACCOUNT_CONSUME_URL: http://server/api/decision/consume
      RELAY_GUEST_CONSUME_URL: http://server/identity/guest-decision/consume
      RELAY_USAGE_URL: http://server/api/decision/usage
  bugsink:
    environment:
      BASE_URL: http://${BUGSINK_DOMAIN:?set BUGSINK_DOMAIN}:${VOWKEY_LOCAL_PORT:-8102}
      BEHIND_HTTPS_PROXY: "false"
  proxy:
    ports: !override
      - "127.0.0.1:${VOWKEY_LOCAL_PORT:-8102}:80"
    volumes:
      - ./Caddyfile.local:/etc/caddy/Caddyfile:ro
