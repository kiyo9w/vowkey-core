<ng-container
  *ngIf="{
    selectedRegion: selectedRegion$ | async,
  } as data"
>
  <div class="tw-mb-1">
    <bit-menu #environmentOptions>
      <button
        *ngFor="let region of availableRegions$ | async; let i = index"
        bitMenuItem
        type="button"
        [attr.aria-pressed]="data.selectedRegion === region ? 'true' : 'false'"
        (click)="toggle(region.key)"
      >
        <bit-icon
          name="bwi-check"
          class="bwi-fw bwi-sm"
          style="padding-bottom: 1px"
          [style.visibility]="data.selectedRegion === region ? 'visible' : 'hidden'"
        ></bit-icon>
        <span>{{ region.domain }}</span>
      </button>
      <button
        bitMenuItem
        type="button"
        [attr.aria-pressed]="data.selectedRegion ? 'false' : 'true'"
        (click)="toggle(ServerEnvironmentType.SelfHosted)"
      >
        <bit-icon
          name="bwi-check"
          class="bwi-fw bwi-sm"
          style="padding-bottom: 1px"
          [style.visibility]="data.selectedRegion ? 'hidden' : 'visible'"
        ></bit-icon>
        <span>{{ "selfHostedServer" | i18n }}</span>
      </button>
    </bit-menu>
    <div class="tw-text-xs tw-text-fg-body-subtle">
      {{ "accessing" | i18n }}
      <button
        [bitMenuTriggerFor]="environmentOptions"
        type="button"
        class="tw-inline-flex tw-items-center tw-gap-1 tw-border-0 tw-bg-transparent tw-px-1.5 tw-py-0.5 tw-rounded-md tw-font-medium tw-text-fg-heading hover:tw-bg-[var(--vk-hover)]"
      >
        <span>{{ data.selectedRegion?.domain || ("selfHostedServer" | i18n) }}</span>
        <bit-icon name="bwi-angle-down" class="bwi-fw bwi-sm tw-text-fg-body-subtle"></bit-icon>
      </button>
    </div>
  </div>
</ng-container>
