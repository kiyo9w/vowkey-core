<div class="tw-flex tw-gap-1 tw-items-center">
  <div class="tw-flex-1">
    <app-vault-search></app-vault-search>
  </div>
  <div class="tw-relative">
    <button
      type="button"
      bitIconButton="bwi-sliders"
      [buttonType]="'primaryGhost'"
      [bitDisclosureTriggerFor]="disclosureRef"
      [label]="'filterVault' | i18n"
      aria-describedby="filters-applied"
    ></button>
    @if (buttonSupportingText$ | async; as supportingText) {
      <p class="tw-sr-only" id="filters-applied">
        {{ supportingText }}
      </p>
    }
    @if (showBadge$ | async) {
      <div
        class="tw-flex tw-items-center tw-justify-center tw-z-10 tw-absolute tw-rounded-full tw-size-[15px] tw-top-[1px] tw-right-[1px] tw-text-notification-600 tw-text-[8px] tw-border-notification-600 tw-border-[0.5px] tw-border-solid tw-bg-notification-100 tw-leading-normal"
        data-testid="filter-badge"
      >
        {{ numberOfAppliedFilters$ | async }}
      </div>
    }
  </div>
</div>
<div class="vk-ext-quick-actions">
  <button
    type="button"
    class="vk-ext-primary-btn"
    data-testid="ext-vault-fill-page"
    (click)="fillThisPage()"
  >
    <svg width="13" height="13" viewBox="0 0 16 16" fill="none" aria-hidden="true">
      <path
        d="M9.2 2L4 9H8L6.8 14L12 7H8L9.2 2Z"
        stroke="currentColor"
        stroke-width="1.35"
        stroke-linejoin="round"
      />
    </svg>
    <span>{{ "vkFillThisPage" | i18n }}</span>
  </button>
  <button
    type="button"
    class="vk-ext-quick-btn vk-ext-ai-btn"
    role="switch"
    data-testid="ext-vault-ai-mode"
    [attr.aria-checked]="aiMode"
    [class.on]="aiMode"
    [title]="(aiMode ? 'vkExtAiModeOn' : 'vkExtAiModeOff') | i18n"
    (click)="toggleAiMode()"
  >
    <svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true">
      <path
        d="M8 1.5l1.6 4.2 4.4 1.3-4.4 1.3L8 12.5 6.4 8.3 2 7l4.4-1.3L8 1.5zM13 11l.7 1.8 1.8.7-1.8.7L13 16l-.7-1.8-1.8-.7 1.8-.7L13 11z"
        fill="currentColor"
      />
    </svg>
    <span>AI</span>
  </button>
  @if (profiles.length > 1) {
    <select
      class="vk-ext-profile-chip"
      data-testid="ext-vault-profile-select"
      [attr.aria-label]="'vkProfileSelectorLabel' | i18n"
      [value]="selectedProfileId"
      (change)="onProfileSelectChange($event)"
    >
      @for (profile of profiles; track profile.id) {
        <option [value]="profile.id">{{ profile.name }}</option>
      }
    </select>
  } @else if (profiles.length === 1) {
    <span
      class="vk-ext-profile-badge"
      data-testid="ext-vault-profile-badge"
      [title]="profiles[0].name"
    >
      {{ profiles[0].name }}
    </span>
  }
  <button
    type="button"
    class="vk-ext-quick-btn"
    data-testid="ext-vault-fill-form"
    (click)="openFillForm(extFormInput)"
  >
    <svg width="13" height="13" viewBox="0 0 16 16" fill="none" aria-hidden="true">
      <rect x="3" y="2" width="10" height="12" rx="1.8" stroke="currentColor" stroke-width="1.35" />
      <path
        d="M5.5 5.5H10.5M5.5 8H10.5M5.5 10.5H8.5"
        stroke="currentColor"
        stroke-width="1.35"
        stroke-linecap="round"
      />
    </svg>
    <span>{{ "vkFillFile" | i18n }}</span>
  </button>
  <input
    #extFormInput
    type="file"
    class="tw-hidden"
    accept=".docx,.xlsx,.hwpx,.pdf"
    (change)="onExtFormSelected($event)"
  />
</div>
@if (extFillNotice) {
  <div class="vk-ext-quick-status" role="status">{{ extFillNotice }}</div>
}
<bit-disclosure
  #disclosureRef
  [open]="initialDisclosureVisibility$ | async"
  (openChange)="toggleFilters($event)"
>
  <app-vault-list-filters></app-vault-list-filters>
</bit-disclosure>
