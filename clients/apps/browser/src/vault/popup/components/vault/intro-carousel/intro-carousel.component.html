<vault-carousel [label]="'introCarouselLabel' | i18n">
  <vault-carousel-slide [label]="'securityPrioritized' | i18n" [disablePadding]="true">
    <div class="tw-flex tw-flex-col tw-items-center tw-justify-around tw-px-2">
      <div class="tw-size-14 tw-content-center tw-my-4 [&>bit-svg>svg]:tw-size-14">
        <bit-svg [content]="itemTypes"></bit-svg>
      </div>
      <h2 bitTypography="h3" class="tw-text-center !tw-font-bold">{{ "securityPrioritized" | i18n }}</h2>
      <p bitTypography="body2" class="tw-text-center tw-text-fg-muted">{{ "securityPrioritizedBody" | i18n }}</p>
    </div>
  </vault-carousel-slide>
  <vault-carousel-slide [label]="'quickLogin' | i18n" [disablePadding]="true">
    <div class="tw-flex tw-flex-col tw-items-center tw-justify-around tw-px-2">
      <div class="tw-size-14 tw-content-center tw-my-4 [&>bit-svg>svg]:tw-size-14">
        <bit-svg [content]="loginCards"></bit-svg>
      </div>
      <h2 bitTypography="h3" class="tw-text-center !tw-font-bold">{{ "quickLogin" | i18n }}</h2>
      <p bitTypography="body2" class="tw-text-center tw-text-fg-muted">{{ "quickLoginBody" | i18n }}</p>
    </div>
  </vault-carousel-slide>
  <vault-carousel-slide [label]="'secureUser' | i18n" [disablePadding]="true">
    <div class="tw-flex tw-flex-col tw-items-center tw-justify-around tw-px-2">
      <div class="tw-size-14 tw-content-center tw-my-4 [&>bit-svg>svg]:tw-size-14">
        <bit-svg [content]="noCredentials"></bit-svg>
      </div>
      <h2 bitTypography="h3" class="tw-text-center !tw-font-bold">{{ "secureUser" | i18n }}</h2>
      <p bitTypography="body2" class="tw-text-center tw-text-fg-muted">{{ "secureUserBody" | i18n }}</p>
    </div>
  </vault-carousel-slide>
  <vault-carousel-slide [label]="'secureDevices' | i18n" [disablePadding]="true">
    <div class="tw-flex tw-flex-col tw-items-center tw-justify-around tw-px-2">
      <div class="tw-size-14 tw-content-center tw-my-4 [&>bit-svg>svg]:tw-size-14">
        <bit-svg [content]="secureDevices"></bit-svg>
      </div>
      <h2 bitTypography="h3" class="tw-text-center !tw-font-bold">{{ "secureDevices" | i18n }}</h2>
      <p bitTypography="body2" class="tw-text-center tw-text-fg-muted">{{ "secureDevicesBody" | i18n }}</p>
    </div>
  </vault-carousel-slide>
</vault-carousel>

<button
  type="button"
  bitButton
  buttonType="primary"
  (click)="navigateToSignup()"
  class="tw-w-full tw-mt-4"
>
  {{ "createAccount" | i18n }}
</button>
<button
  type="button"
  bitButton
  buttonType="secondary"
  (click)="navigateToLogin()"
  class="tw-w-full tw-mt-2"
>
  {{ "logIn" | i18n }}
</button>
<div class="tw-mt-3 tw-text-center">
  <button type="button" bitLink linkType="subtle" (click)="navigateToLocal()" class="tw-text-xs">
    {{ "vowkeyContinueWithoutAccount" | i18n }}
  </button>
</div>
