<popup-page>
  <popup-header slot="header" pageTitle="{{ 'settings' | i18n }}">
    <ng-container slot="end">
      <app-pop-out></app-pop-out>
      <app-current-account></app-current-account>
    </ng-container>
  </popup-header>

  <bit-item-group>
    <bit-item>
      <a bit-item-content routerLink="/tabs/agents" [truncate]="false">
        <i slot="start" class="bwi bwi-plug" aria-hidden="true"></i>
        {{ "vowkeyAgents" | i18n }}
        <i slot="end" class="bwi bwi-angle-right" aria-hidden="true"></i>
      </a>
    </bit-item>
    <bit-item>
      <a bit-item-content routerLink="/autofill" [truncate]="false">
        <i slot="start" class="bwi bwi-check-circle" aria-hidden="true"></i>
        {{ "autofillNoun" | i18n }}
        <i slot="end" class="bwi bwi-angle-right" aria-hidden="true"></i>
      </a>
    </bit-item>
    <bit-item>
      <a bit-item-content routerLink="/tabs/privacy" [truncate]="false">
        <i slot="start" class="bwi bwi-shield" aria-hidden="true"></i>
        {{ "privacy" | i18n }}
        <i slot="end" class="bwi bwi-angle-right" aria-hidden="true"></i>
      </a>
    </bit-item>
    <bit-item>
      <a bit-item-content routerLink="/account-security" [truncate]="false">
        <i slot="start" class="bwi bwi-lock" aria-hidden="true"></i>
        {{ "accountSecurity" | i18n }}
        <i slot="end" class="bwi bwi-angle-right" aria-hidden="true"></i>
      </a>
    </bit-item>
    <bit-item>
      <a bit-item-content routerLink="/about" [truncate]="false">
        <i slot="start" class="bwi bwi-info-circle" aria-hidden="true"></i>
        {{ "about" | i18n }}
        <i slot="end" class="bwi bwi-angle-right" aria-hidden="true"></i>
      </a>
    </bit-item>
  </bit-item-group>
</popup-page>
