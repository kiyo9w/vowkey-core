[package]
name = "desktop_napi"
exclude = ["index.node"]
edition = { workspace = true }
license = { workspace = true }
version = { workspace = true }
publish = { workspace = true }

[package.metadata.cargo-udeps.ignore]
normal = ["napi-derive-backend"]

[lib]
crate-type = ["cdylib"]

[features]
default = []
manual_test = []

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
autofill_provider = { path = "../autofill_provider", features = ["napi"] }
autotype = { path = "../autotype" }
biometric = { path = "../biometric" }
chromium_importer = { path = "../chromium_importer" }
desktop_core = { path = "../core" }
napi = { workspace = true, features = ["async", "anyhow"] }
napi-derive = { workspace = true }
napi-derive-backend = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
ssh_agent = { path = "../ssh_agent" }
tokio = { workspace = true, features = ["time"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = { workspace = true }
windows-registry = { workspace = true }
windows_plugin_authenticator = { path = "../windows_plugin_authenticator" }

[build-dependencies]
napi-build = { workspace = true }

[lints]
workspace = true
