<!doctype html>
<html class="theme_light" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2563eb" />

    <title>Vowkey</title>

    <link rel="apple-touch-icon" sizes="180x180" href="../images/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="../images/icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="../images/icons/favicon-16x16.png" />
    <link rel="mask-icon" href="../images/icons/safari-pinned-tab.svg" color="#2563eb" />
    <link rel="manifest" href="../manifest.json" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f5f4f0;
        color: #121216;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .vk-connector-card {
        max-width: 360px;
        width: 100%;
        background: #ffffff;
        border: 1px solid #e2e0da;
        border-radius: 16px;
        padding: 28px 24px;
        text-align: center;
        box-shadow:
          0 1px 2px rgba(18, 18, 22, 0.04),
          0 12px 28px -12px rgba(18, 18, 22, 0.09);
      }
      .vk-connector-spinner {
        width: 20px;
        height: 20px;
        margin: 0 auto 12px;
        border-radius: 9999px;
        border: 2px solid rgba(18, 18, 22, 0.16);
        border-top-color: #121216;
        animation: vk-spin 0.65s linear infinite;
      }
      @keyframes vk-spin {
        to {
          transform: rotate(360deg);
        }
      }
      .vk-connector-card p {
        margin: 0;
        font-size: 14px;
        line-height: 1.5;
        color: #5b5d66;
      }
    </style>
  </head>

  <body class="layout_frontend">
    <div class="vk-connector-card">
      <div id="content">
        <div class="vk-connector-spinner" aria-hidden="true"></div>
        <p>Signing in to Vowkey…</p>
      </div>
    </div>
  </body>
</html>
